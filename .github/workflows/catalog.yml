name: Actualizar catálogo ByFly

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar regeneración'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: byfly-catalog-production
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: byflycatalogo
      CATALOG_SHEET_URL: ${{ vars.CATALOG_SHEET_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: catalog-automation/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r catalog-automation/requirements.txt

      - name: Verificar validaciones y publicación
        run: python -m unittest discover -s catalog-automation -p 'test_*.py'

      - name: Actualizar PDF
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python catalog-automation/sync.py --force
          else
            python catalog-automation/sync.py
          fi

      - name: Conservar PDF e informe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-verificado
          path: |
            catalog-automation/work/ByFly_Catalogo.pdf
            catalog-automation/work/verification.json
            catalog-automation/work/revision.csv
          if-no-files-found: ignore
          retention-days: 7
