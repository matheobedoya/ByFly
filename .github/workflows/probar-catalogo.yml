name: Probar catálogo sin los SKU pendientes
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: byfly-catalog-production
  cancel-in-progress: false
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: byflycatalogo
      CATALOG_SHEET_URL: ${{ vars.CATALOG_SHEET_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r catalog-automation/requirements.txt
      - run: python -m unittest discover -s catalog-automation -p 'test_*.py'
      - run: python catalog-automation/sync.py --preview
      - uses: actions/upload-artifact@v4
        with:
          name: catalogo-de-prueba
          path: |
            catalog-automation/work/ByFly_Catalogo.pdf
            catalog-automation/work/verification.json
            catalog-automation/work/filas_omitidas.csv
          retention-days: 7
